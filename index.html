      tx(g, nm, W / 2, 372, 54, '800', K_INK, 'center');
      tx(g, (now.getMonth() + 1) + '월에 스스로 챙긴 날', W / 2, 424, 30, '700', K_INK2, 'center');

      g.font = '700 132px "Baloo 2", "Gothic A1", sans-serif';
      var numW = g.measureText(String(n)).width;
      g.textAlign = 'left'; g.fillStyle = K_ACC;
      var totalW = numW + 14 + 52;
      g.fillText(String(n), (W - totalW) / 2, 566);
      tx(g, '일', (W - totalW) / 2 + numW + 14, 566, 46, '800', K_ACCI, 'left');

      // 달력 (그 달에 필요한 줄 수만큼만)
      var cx0 = 108, cyTop = 640, cw = 120, ch = 78;
      var firstD = new Date(now.getFullYear(), now.getMonth(), 1);
      var lastD = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      var rowsUsed = 1;
      for (var q = 2; q <= lastD; q++) {
        if (dw(new Date(now.getFullYear(), now.getMonth(), q)) === 1) rowsUsed++;
      }
      var calH = 40 + rowsUsed * ch + 30;
      fillRR(g, 72, cyTop - 34, W - 144, calH, 40, K_CARD);
      var dn = ['월', '화', '수', '목', '금', '토', '일'];
      for (var i = 0; i < 7; i++) {
        tx(g, dn[i], cx0 + i * cw + cw / 2, cyTop + 30, 24, '700', i >= 5 ? K_INK3 : K_INK2, 'center');
      }
      var row = 0;
      for (var d = 1; d <= lastD; d++) {
        var dt = new Date(now.getFullYear(), now.getMonth(), d);
        var col = dw(dt) - 1;
        if (d > 1 && col === 0) row++;
        var ccx = cx0 + col * cw + cw / 2, ccy = cyTop + 76 + row * ch;
        var on = !!stamps()[iso(dt)];
        g.beginPath(); g.arc(ccx, ccy, 28, 0, Math.PI * 2);
        g.fillStyle = on ? K_ACC : K_SUNK; g.fill();
        tx(g, String(d), ccx, ccy + 10, 24, on ? '800' : '600', on ? '#FFFFFF' : K_INK3, 'center');
        if (on) star(g, ccx + 22, ccy - 22, 13, K_ACCI);
      }

      // 학원
      var cl = classes(), py = cyTop - 34 + calH + 74;
      tx(g, '다니는 학원', 108, py, 26, '800', K_INK2, 'left');
      var bx = 108;
      cl.forEach(function (c) {
        var label = shortName(c.name);
        g.font = '800 27px "Gothic A1", sans-serif';
        var wdt = g.measureText(label).width + 44;
        fillRR(g, bx, py + 26, wdt, 58, 20, hx(c.color, 0));
        tx(g, label, bx + wdt / 2, py + 65, 27, '800', hx(c.color, 1), 'center');
        bx += wdt + 14;
      });

      tx(g, '학원노트', W / 2, H - 56, 24, '700', K_INK3, 'center');
      return cv;
    });
  }

  function infoCard() {
    var W = 1080, H = 1350, nm = String(S.d.config.name || '아이');
    var cl = classes().slice(0, 6), rl = rides().slice().sort(function (a, b) {
      return (a.days[0] || 9) - (b.days[0] || 9) || (a.time ? mn(a.time) : -1) - (b.time ? mn(b.time) : -1);
    }).slice(0, 6);
    return ensureFonts().then(photoOrNull).then(function (im) {
      var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var g = cv.getContext('2d');
      g.fillStyle = K_BG; g.fillRect(0, 0, W, H);

      circleImg(g, im, 190, 190, 92);
      tx(g, '우리 아이 정보', 316, 156, 26, '800', K_INK3, 'left');
      tx(g, nm + (S.d.config.age ? ' · ' + S.d.config.age + '세' : ''), 316, 224, 52, '800', K_INK, 'left');

      var y = 316;
      // 학원
      var chH = 58 + cl.length * 104;
      fillRR(g, 72, y, W - 144, chH, 40, K_CARD);
      tx(g, '학원', 120, y + 58, 27, '800', K_INK2, 'left');
      cl.forEach(function (c, i) {
        var ly = y + 112 + i * 104;
        fillRR(g, 120, ly - 34, 56, 56, 18, hx(c.color, 0));
        tx(g, ini(c.name), 148, ly + 6, 27, '800', hx(c.color, 1), 'center');
        tx(g, c.name, 196, ly - 4, 30, '800', K_INK, 'left');
        tx(g, timeText(c) + (c.place ? '  ·  ' + c.place : ''), 196, ly + 36, 23, '600', K_INK2, 'left');
      });
      y += chH + 30;

      // 차량
      var rhH = 58 + Math.max(1, rl.length) * 72;
      fillRR(g, 72, y, W - 144, rhH, 40, K_CARD);
      tx(g, '이동 · 차량', 120, y + 58, 27, '800', K_INK2, 'left');
      if (rl.length) {
        rl.forEach(function (r, i) {
          var ly = y + 110 + i * 72;
          tx(g, (r.time || '--:--'), 120, ly, 27, '700', K_ACCI, 'left');
          tx(g, r.label, 250, ly, 27, '800', K_INK, 'left');
          tx(g, r.days.map(function (d2) { return DAY[d2]; }).join('·') + ' · ' + (r.kind === 'back' ? '하원' : '탑승'),
            W - 120, ly, 23, '700', K_INK2, 'right');
        });
      } else {
        tx(g, '등록된 차량이 없어요', 120, y + 110, 25, '600', K_INK3, 'left');
      }
      y += rhH + 30;

      // 연락처
      var gd = String(S.d.config.guardian || '').trim();
      fillRR(g, 72, y, W - 144, 148, 40, K_ACCS);
      tx(g, '보호자 연락처', 120, y + 56, 24, '800', K_ACCI, 'left');
      tx(g, gd || '설정에서 연락처를 넣어 주세요', 120, y + 112, gd ? 38 : 27, '800', K_ACCI, 'left');

      tx(g, '학원노트', W / 2, H - 56, 24, '700', K_INK3, 'center');
      return cv;
    });
  }

  function showCard(maker, name) {
    toast('카드를 만드는 중이에요');
    maker().then(function (cv) {
      S.cardUrl = cv.toDataURL('image/png');
      S.cardName = name;
      S.sheet = { k: 'card' }; S.draft = {}; S.confirm = null;
      renderSheet();
    }).catch(function () { toast('카드를 만들지 못했어요'); });
  }

  function saveCard() {
    var name = (S.cardName || '학원노트') + '.png';
    fetch(S.cardUrl).then(function (r) { return r.blob(); }).then(function (blob) {
      var file = null;
      try { file = new File([blob], name, { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () {});
        return;
      }
      var u = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = u; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
      toast('저장했어요');
    }).catch(function () { toast('이미지를 길게 눌러 저장해 주세요'); });
  }

  /* ==================== 백업 / 복원 ==================== */
  function doBackup() {
    var blob = new Blob([JSON.stringify(S.d, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '학원노트-' + iso(new Date()) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('백업 파일을 저장했어요');
  }
  function doRestore() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          S.d = fix(JSON.parse(String(fr.result)));
          save(); closeSheet(); render(); toast('복원했어요');
        } catch (e) { toast('백업 파일을 읽을 수 없어요'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  /* ==================== 시작 ==================== */
  load();
  render();

  // 날짜가 바뀌면 오늘 기준을 갱신
  var lastDay = iso(new Date());
  setInterval(function () {
    var now = iso(new Date());
    if (now !== lastDay) {
      lastDay = now;
      if (S.supDate < now) S.supDate = now;
      render(true);
    } else if (S.view === 'today') {
      render(true); // 남은 시간 갱신
    }
  }, 60000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
